[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jailbreak-response-classifier"
version = "0.1.0"
description = "Multiclass NLP classification of LLM responses using ModernBERT and BART"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "transformers>=4.48,<5",
    "datasets>=2.19,<5",
    "accelerate>=0.28",
    "numpy>=1.26",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
classify-train = "jailbreak_classifier.train:main"
classify-eval = "jailbreak_classifier.evaluate:main"
classify-predict = "jailbreak_classifier.predict:main"
classify-generate = "jailbreak_classifier.generate:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
